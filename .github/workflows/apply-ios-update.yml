name: One-time iPhone source update
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: one-time-iphone-source-update
  cancel-in-progress: false
jobs:
  apply-and-dispatch:
    if: github.ref == 'refs/heads/main' && (github.actor == 'cue-ipa-vranlr' || github.actor == 'yuleo559-lang')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply the reviewed source update
        shell: bash
        run: |
          set -euo pipefail
          echo 'c3db985c370aaeef0c4ba1e2a37d86d3c3ef3b301103f048bb27b8e6738990fc  folia-ios-update.patch' | sha256sum --check --strict -
          git apply --check folia-ios-update.patch
          git apply --binary folia-ios-update.patch
          rm folia-ios-update.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat(ios): add Spotify playlist access and mobile interactions'
          git push origin HEAD:main
          echo "Updated iPhone source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the existing unsigned iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ios-build.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Dispatched iOS build (unsigned) on main. Apple signing is still required for installation.' >> "$GITHUB_STEP_SUMMARY"
