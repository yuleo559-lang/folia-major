name: Fix iPhone playback and rebuild
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-playback-fix.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: ios-playback-fix
  cancel-in-progress: false
jobs:
  apply-test-build:
    if: github.ref == 'refs/heads/main' && (github.actor == 'cue-ipa-vranlr' || github.actor == 'yuleo559-lang')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify and apply reviewed playback fix
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, pathlib
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == 'ed9959c1b1847d3d9bd7369c7e4c197c6c5179f4af1bb6fe713f0be351831004'
          pathlib.Path('/tmp/playback.patch').write_bytes(patch)
          PYCODE
          git apply --check /tmp/playback.patch
          git apply /tmp/playback.patch
      - name: Install locked dependencies
        run: npm ci
      - name: Validate corrected source
        run: |
          npm run typecheck
          npm run test:unit
      - name: Commit fix and remove this temporary workflow
        run: |
          git rm .github/workflows/ios-playback-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix(ios): hand Spotify playback to the native app'
          git push origin HEAD:main
          echo "Playback fix commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build corrected unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ios-build.yml --repo "$GITHUB_REPOSITORY" --ref main
